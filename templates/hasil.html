{% extends "base.html" %}

{% block title %}
Hasil Analisis
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-lg-9">

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">

                    <i class="bi bi-file-earmark-text-fill"></i>

                    Hasil Analisis

                </h3>

            </div>

            <div class="card-body">

                <h2 class="fw-bold">

                    {{ hasil.mata_kuliah }}

                </h2>

                <hr>

                <div
                    class="border rounded p-4 bg-light"
                    style="
                        white-space: pre-wrap;
                        line-height:1.8;
                        font-size:1rem;
                    ">

                    {{ hasil.isi }}

                </div>

            </div>

        </div>

    </div>

    <div class="col-lg-3">

        <div class="card shadow border-0">

            <div class="card-header">

                <strong>

                    Informasi

                </strong>

            </div>

            <div class="card-body">

                <p>

                    <i class="bi bi-cpu text-primary"></i>

                    <strong>Model AI</strong>

                    <br>

                    {{ hasil.model }}

                </p>

                <hr>

                <p>

                    <i class="bi bi-stopwatch text-success"></i>

                    <strong>Waktu Proses</strong>

                    <br>

                    {{ "%.2f"|format(hasil.waktu_proses) }} detik

                </p>

            </div>

        </div>

        <div class="card shadow border-0 mt-3">

            <div class="card-header">

                <strong>

                    Aksi

                </strong>

            </div>

            <div class="card-body d-grid gap-2">

                <a
                    href="/hasil/{{ hasil.mata_kuliah }}/word"
                    class="btn btn-success">

                    <i class="bi bi-download"></i>

                    Download Word

                </a>

                <a
                    href="/mata-kuliah/{{ hasil.mata_kuliah }}"
                    class="btn btn-outline-primary">

                    <i class="bi bi-arrow-left"></i>

                    Kembali

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
